document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t=\"3\">\n              <div style=\"display: flex; gap: 11px; align-items: baseline; cursor: help;\" data-tip=\"{{ r.tip }}\">\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #B83C15;\">{{ r.n }}<\u002Fspan>\n                <span style=\"font-size: 14px; line-height: 1.5; color: #3C434A; text-wrap: pretty;\">{{ r.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top: auto; border-top: 1px solid #E6E9EC; padding-top: 12px; display: flex; gap: 22px; flex-wrap: wrap;\">\n            <div style=\"display: flex; flex-direction: column; gap: 3px;\"><span style=\"font-family: Archivo, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.03em;\">{{ payback }} mo<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6B727A; letter-spacing: 0.06em;\">PAYBACK<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 3px;\"><span style=\"font-family: Archivo, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.03em;\">{{ firstValue }} wk<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6B727A; letter-spacing: 0.06em;\">TIME TO FIRST VALUE<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ gated }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position: absolute; inset: 0; z-index: 5; background: rgba(251,250,248,0.72); backdrop-filter: blur(7px); display: flex; align-items: center; justify-content: center; padding: 16px;\">\n            <div style=\"width: min(460px, 100%); background: #FFFFFF; border: 1px solid #E6E9EC; border-top: 3px solid #F0703F; border-radius: 3px; padding: 24px; display: flex; flex-direction: column; gap: 13px; box-shadow: 0 18px 40px rgba(21,24,28,0.12);\">\n              <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; color: #B83C15;\">UNLOCK THE FULL REPORT<\u002Fdiv>\n              <div style=\"font-family: Archivo, sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; text-wrap: pretty;\">Tell us where to send it.<\u002Fdiv>\n              <div style=\"font-size: 13.5px; line-height: 1.55; color: #4A5158;\">Your range above stays free. This unlocks the breakdown, the recommendations and a PDF you can take to your leadership.<\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 9px;\">\n                <input type=\"text\" placeholder=\"Full name\" value=\"{{ formName }}\" sc-camel-on-change=\"{{ onName }}\" sc-camel-on-input=\"{{ onName }}\" style=\"border: 1px solid #D7DBDF; border-radius: 2px; padding: 10px 11px; font-size: 13.5px; width: 100%; box-sizing: border-box;\">\n                <input type=\"text\" placeholder=\"Company\" value=\"{{ formCompany }}\" sc-camel-on-change=\"{{ onCompany }}\" sc-camel-on-input=\"{{ onCompany }}\" style=\"border: 1px solid #D7DBDF; border-radius: 2px; padding: 10px 11px; font-size: 13.5px; width: 100%; box-sizing: border-box;\">\n                <input type=\"email\" placeholder=\"Work email\" value=\"{{ formEmail }}\" sc-camel-on-change=\"{{ onEmail }}\" sc-camel-on-input=\"{{ onEmail }}\" style=\"border: 1px solid #D7DBDF; border-radius: 2px; padding: 10px 11px; font-size: 13.5px; width: 100%; box-sizing: border-box;\">\n                <input type=\"text\" placeholder=\"Role\" value=\"{{ formRole }}\" sc-camel-on-change=\"{{ onRole }}\" sc-camel-on-input=\"{{ onRole }}\" style=\"border: 1px solid #D7DBDF; border-radius: 2px; padding: 10px 11px; font-size: 13.5px; width: 100%; box-sizing: border-box;\">\n              <\u002Fdiv>\n              <label style=\"display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; line-height: 1.5; color: #4A5158; cursor: pointer;\">\n                <input type=\"checkbox\" checked=\"{{ optIn }}\" sc-camel-on-change=\"{{ onOptIn }}\" style=\"margin-top: 2px;\">\n                <span>Send me the PDF and have someone from Steel Cloud follow up. No newsletter, no list.<\u002Fspan>\n              <\u002Flabel>\n              <button type=\"button\" sc-camel-on-click=\"{{ submit }}\" style=\"cursor: pointer; background: #D0441C; border: 1px solid #D0441C; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.08em; padding: 12px 16px; border-radius: 2px;\">SHOW MY FULL BREAKDOWN →<\u002Fbutton>\n              <div style=\"font-size: 12px; color: #B83C15; min-height: 15px;\">{{ error }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"font-size: 12.5px; line-height: 1.6; color: #6B727A; border-top: 1px solid #E6E9EC; padding-top: 14px; max-width: 760px; text-wrap: pretty;\">Figures are directional estimates based on outcomes at similar organisations, not guarantees. Your actual return depends on scope, adoption and executive sponsorship.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showMethod }}\" hint-placeholder-val=\"{{ false }}\">\n  <div id=\"method\" style=\"animation: sc-reveal 0.55s ease both; background: #15181C; color: #FFFFFF;\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 48px 32px 52px; display: flex; flex-direction: column; gap: 24px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px 48px; align-items: end;\">\n        <h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-size: clamp(26px, 3vw, 36px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.08; text-wrap: pretty; min-width: 0;\">How we got to that number.<\u002Fh2>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #A9B0B7; min-width: 0;\">Three layers, all of them visible. We would rather show the arithmetic than ask you to trust a single confident figure.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;\">\n        <div style=\"min-width: 0; border: 1px solid #262B31; border-top: 3px solid #6B727A; border-radius: 3px; padding: 22px; display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; color: #A9B0B7;\">LAYER 01 · BASELINE<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600;\">Industry benchmarks<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6; color: #A9B0B7; text-wrap: pretty;\">Published efficiency, cost and revenue ranges for AI and Salesforce investment, segmented by vertical and size band. The floor — what comparable organisations broadly see.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-width: 0; border: 1px solid #262B31; border-top: 3px solid #D0441C; border-radius: 3px; padding: 22px; display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; color: #F0703F;\">LAYER 02 · YOUR INPUTS<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600;\">Client-specific adjustment<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6; color: #A9B0B7; text-wrap: pretty;\">Maturity, integration, manual process share and stated pain points scale the baseline. Less maturity usually means more upside available; more maturity narrows the range but raises confidence.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-width: 0; border: 1px solid #262B31; border-top: 3px solid #F0703F; border-radius: 3px; padding: 22px; display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; color: #F0703F;\">LAYER 03 · OUR RECORD<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600;\">Delivery multiplier<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6; color: #A9B0B7; text-wrap: pretty;\">A factor grounded in what our own engagements actually returned — the difference between a generic industry calculator and a number backed by platforms running in production.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showReport }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation: sc-reveal 0.55s ease both; background: #FBFAF8; border-top: 1px solid #E6E9EC;\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 40px 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px 48px; align-items: center;\">\n      <div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0;\">\n        <h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-size: clamp(22px, 2.4vw, 30px); font-weight: 700; letter-spacing: -0.035em; text-wrap: pretty;\">Want the version with your own numbers in it?<\u002Fh2>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #4A5158; max-width: 520px;\">A two-week assessment replaces every benchmark on this page with measurements from your estate.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; min-width: 0;\">\n        <a href=\"#report\" style=\"background: #D0441C; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.08em; padding: 13px 18px; border-radius: 2px;\">SCOPE AN ASSESSMENT<\u002Fa>\n        <a href=\"#top\" style=\"border: 1px solid #D7DBDF; color: #3C434A; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.08em; padding: 13px 18px; border-radius: 2px;\">START OVER<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280},&quot;gateEnabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Lead capture&quot;},&quot;deliveryMultiplier&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.12,&quot;min&quot;:1,&quot;max&quot;:1.4,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Model&quot;},&quot;upsideFactor&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.5,&quot;min&quot;:1.2,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Model&quot;}}\">\nconst IND = {\n  'Equipment dealer': { eff: 0.30, rev: 0.050, opp: 'Service dispatch and parts quoting — the touches between a call coming in and a truck moving.', cmp: 'Dealers of your size typically recover 8–15 hours per week per service coordinator.' },\n  'Member association': { eff: 0.26, rev: 0.040, opp: 'Member engagement and renewals — knowing who is drifting before the renewal notice goes out.', cmp: 'Associations of your size typically lift renewal rates 3–6 points within two cycles.' },\n  'Manufacturing': { eff: 0.24, rev: 0.042, opp: 'Quote-to-order handoffs — the manual re-keying between engineering, sales and the floor.', cmp: 'Manufacturers of your size typically cut quote turnaround by a third.' },\n  'Distribution': { eff: 0.27, rev: 0.045, opp: 'Order exceptions and account visibility — the work created when systems disagree.', cmp: 'Distributors of your size typically remove 20–30% of manual order handling.' },\n  'Professional services': { eff: 0.22, rev: 0.060, opp: 'Pipeline visibility and utilisation — forecasting from evidence rather than optimism.', cmp: 'Services firms of your size typically add 4–8 points of close rate.' }\n};\nconst SIZE = {\n  'Under 50': { emp: 30, rev: 12e6 },\n  '50–199': { emp: 110, rev: 45e6 },\n  '200–499': { emp: 330, rev: 140e6 },\n  '500–999': { emp: 720, rev: 320e6 },\n  '1,000+': { emp: 1500, rev: 750e6 }\n};\nconst GOAL = {\n  'Cut costs': { t: 1.15, r: 0.7 },\n  'Grow revenue': { t: 0.8, r: 1.35 },\n  'Improve customer experience': { t: 0.95, r: 1.1 },\n  'Free up staff time': { t: 1.3, r: 0.6 }\n};\nconst MAT = {\n  'None yet': { manual: 0.62, adj: 1.12, weeks: 10 },\n  'Exploring': { manual: 0.52, adj: 1.06, weeks: 8 },\n  'Piloting': { manual: 0.42, adj: 0.96, weeks: 6 },\n  'Scaling': { manual: 0.30, adj: 0.85, weeks: 5 }\n};\nconst PAINS = ['Slow response times', 'Manual data entry', 'Poor visibility / reporting', 'Inconsistent customer experience', 'Staff turnover and training'];\nconst AREAS = [\n  { key: 'data', name: 'Data foundation & governance', label: 'data foundation & governance', shortLabel: 'data', short: 'Data', sub: 'master data · ownership · quality rules · lineage', top: 4.3,\n    prompt: 'Who owns the definition of a customer record?',\n    opts: [['No one — every system defines it differently', 1.4], ['IT keeps it tidy informally', 2.3], ['A named owner with documented quality rules', 3.4], ['Governed with lineage and monitoring', 4.4]] },\n  { key: 'integration', name: 'Systems integration', label: 'systems integration', shortLabel: 'integration', short: 'Integration', sub: 'ERP ↔ CRM · APIs · events · reconciliation', top: 4.1,\n    prompt: 'How do your ERP and CRM stay in step?',\n    opts: [['Exports and re-keying by hand', 1.3], ['Nightly batch jobs', 2.4], ['APIs on the objects that matter', 3.4], ['Event-driven and reconciled daily', 4.4]] },\n  { key: 'revops', name: 'Revenue operations', label: 'revenue operations', shortLabel: 'revenue ops', short: 'Revenue ops', sub: 'pipeline · quoting & CPQ · order-to-cash · pricing', top: 4.4,\n    prompt: 'How does a quote get produced today?',\n    opts: [['Spreadsheets and tribal knowledge', 1.5], ['In the CRM, priced manually', 2.5], ['Guided CPQ for most deals', 3.5], ['CPQ with approvals and margin control', 4.5]] },\n  { key: 'service', name: 'Service operations', label: 'service operations', shortLabel: 'service', short: 'Service', sub: 'intake · dispatch · SLA · parts and warranty', top: 4.2,\n    prompt: 'How does a service request travel from intake to resolution?',\n    opts: [['Phone and email, tracked by whoever took it', 1.4], ['Logged in a system after the fact', 2.4], ['One queue, dispatched against SLAs', 3.5], ['Instrumented end to end with response commitments', 4.5]] },\n  { key: 'analytics', name: 'Analytics & reporting', label: 'analytics & reporting', shortLabel: 'analytics', short: 'Analytics', sub: 'definitions · warehouse · self-serve · trust', top: 4.0,\n    prompt: 'Where does leadership get its numbers?',\n    opts: [['Spreadsheets rebuilt every month', 1.4], ['Static reports out of each system', 2.4], ['One warehouse with agreed definitions', 3.5], ['Self-serve on monitored metric definitions', 4.4]] },\n  { key: 'ai', name: 'AI readiness', label: 'AI readiness', shortLabel: 'AI readiness', short: 'AI readiness', sub: 'use cases · data access · adoption · production', top: 3.9,\n    prompt: 'What has actually happened with AI so far?',\n    opts: [['Nothing formal yet', 1.2], ['Individuals using tools ad hoc', 2.2], ['Pilots running, none in production', 3.0], ['At least one use case live in production', 4.3]] }\n];\nconst LOADED = 78000;\nconst DELIVERY = 1.12;\n\nclass Component extends DCLogic {\n  state = {\n    stage: 0, methodOpen: false,\n    industry: null, size: null, goal: null, maturity: null,\n    crm: null, integration: null, manual: null, pains: [], hours: '', fnHead: '',\n    refineOpen: false, scoreOpen: false, areaScores: {}, gated: null, form: { name: '', email: '', company: '', role: '' }, error: ''\n  };\n\n  set(k, v) { this.setState({ [k]: v }); }\n\n  eff() {\n    const s = this.state;\n    return Object.assign({}, s, {\n      industry: s.industry || 'Equipment dealer',\n      size: s.size || '200–499',\n      goal: s.goal || 'Free up staff time',\n      maturity: s.maturity || 'Exploring'\n    });\n  }\n\n  quickDone() {\n    const s = this.state;\n    return !!(s.industry && s.size && s.goal && s.maturity);\n  }\n\n  glideTo(id, delay) {\n    setTimeout(() => {\n      const t = document.getElementById(id);\n      if (!t) return;\n      const se = document.scrollingElement || document.documentElement;\n      const nav = document.getElementById('nav');\n      const pad = (nav ? nav.getBoundingClientRect().height : 0) + 20;\n      const to = Math.max(0, Math.min(t.getBoundingClientRect().top + window.pageYOffset - pad, se.scrollHeight - window.innerHeight));\n      const from = se.scrollTop;\n      const dist = to - from;\n      if (Math.abs(dist) < 2) return;\n      document.documentElement.style.scrollBehavior = 'auto';\n      if (this.scrollRaf) cancelAnimationFrame(this.scrollRaf);\n      if (this.scrollGuard) clearTimeout(this.scrollGuard);\n      const dur = Math.min(1500, Math.max(650, Math.abs(dist) * 0.85));\n      const t0 = (window.performance || Date).now();\n      let ticks = 0;\n      const step = () => {\n        const p = Math.min(1, (((window.performance || Date).now()) - t0) / dur);\n        const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;\n        se.scrollTop = from + dist * e;\n        ticks++;\n        if (p < 1) this.scrollRaf = requestAnimationFrame(step);\n      };\n      this.scrollRaf = requestAnimationFrame(step);\n      this.scrollGuard = setTimeout(() => {\n        if (ticks === 0) { if (this.scrollRaf) cancelAnimationFrame(this.scrollRaf); se.scrollTop = to; }\n      }, 420);\n    }, delay || 90);\n  }\n\n  advance(stage, id) {\n    if (this.state.stage < stage) this.setState({ stage });\n    this.glideTo(id, this.state.stage < stage ? 140 : 40);\n  }\n\n  componentDidMount() {\n    this.tip = document.createElement('div');\n    this.tip.setAttribute('style', \"position: fixed; z-index: 900; max-width: 280px; background: #15181C; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif; font-size: 12.5px; line-height: 1.5; padding: 10px 12px; border-radius: 3px; border-top: 2px solid #F0703F; box-shadow: 0 10px 28px rgba(21,24,28,0.22); pointer-events: none; opacity: 0; transition: opacity 0.14s ease;\");\n    document.body.appendChild(this.tip);\n\n    this.onOver = (e) => {\n      const el = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;\n      if (!el) { this.tip.style.opacity = '0'; return; }\n      this.tip.textContent = el.getAttribute('data-tip');\n      this.tip.style.opacity = '1';\n      this.place(e);\n    };\n    this.onMove = (e) => { if (this.tip.style.opacity === '1') this.place(e); };\n    document.addEventListener('mouseover', this.onOver);\n    document.addEventListener('mousemove', this.onMove);\n\n    this.onAnchorClick = (e) => {\n      const a = e.target && e.target.closest ? e.target.closest('a[href^=\"#\"]') : null;\n      if (!a) return;\n      const raw = a.getAttribute('href');\n      e.preventDefault();\n      const id = raw && raw.length > 1 ? decodeURIComponent(raw.slice(1)) : null;\n      if (!id || id === 'top') { this.glideTo('top', 0); return; }\n      const stages = { calculator: 1, refine: 2, maturity: 3, report: 4 };\n      if (id === 'method') { if (!this.state.methodOpen) this.setState({ methodOpen: true }); this.glideTo('method', 140); return; }\n      if (stages[id]) { this.advance(stages[id], id); return; }\n      this.glideTo(id, 0);\n    };\n    document.addEventListener('click', this.onAnchorClick, true);\n  }\n\n  place(e) {\n    const r = this.tip.getBoundingClientRect();\n    let x = e.clientX + 16, y = e.clientY + 16;\n    if (x + r.width > window.innerWidth - 12) x = e.clientX - r.width - 16;\n    if (y + r.height > window.innerHeight - 12) y = e.clientY - r.height - 16;\n    this.tip.style.left = Math.max(8, x) + 'px';\n    this.tip.style.top = Math.max(8, y) + 'px';\n  }\n\n  componentWillUnmount() {\n    document.removeEventListener('mouseover', this.onOver);\n    document.removeEventListener('mousemove', this.onMove);\n    document.removeEventListener('click', this.onAnchorClick, true);\n    if (this.tip && this.tip.parentNode) this.tip.parentNode.removeChild(this.tip);\n  }\n\n  togglePain(p) {\n    const has = this.state.pains.indexOf(p) > -1;\n    this.setState({ pains: has ? this.state.pains.filter(x => x !== p) : this.state.pains.concat([p]) });\n  }\n\n  money(n) {\n    if (n >= 1e6) return '$' + (Math.round(n / 5e4) * 5e4 / 1e6).toFixed(n < 1e7 ? 2 : 1).replace(/\\.0+$/, '') + 'M';\n    return '$' + Math.round(n / 5e3) * 5 + 'k';\n  }\n\n  model() {\n    const s = this.eff();\n    const ind = IND[s.industry], sizeBand = SIZE[s.size], goal = GOAL[s.goal], mat = MAT[s.maturity];\n    const revOverride = s.revenue ? Number(s.revenue) * 1e6 : null;\n    const size = { emp: sizeBand.emp, rev: revOverride && revOverride > 0 ? revOverride : sizeBand.rev };\n    const manual = s.manual === null ? mat.manual : s.manual / 100;\n    const fnHead = s.fnHead ? Math.max(1, Number(s.fnHead)) : Math.round(size.emp * 0.35);\n    const integ = s.integration === 'Siloed' ? 1.18 : s.integration === 'Partially connected' ? 1.0 : s.integration === 'Unified' ? 0.86 : 1.0;\n    const crm = s.crm === 'None' ? 1.12 : s.crm === 'Other CRM' ? 1.05 : s.crm === 'Salesforce' ? 0.94 : 1.0;\n    const painLift = 1 + Math.min(0.18, s.pains.length * 0.045);\n    const hoursAdj = s.hours ? Math.min(1.35, Math.max(0.7, Number(s.hours) / 12)) : 1;\n\n    const time = fnHead * LOADED * manual * ind.eff * goal.t * hoursAdj;\n    const revenue = size.rev * ind.rev * goal.r;\n    const risk = (time + revenue) * 0.12;\n    const delivery = this.props.deliveryMultiplier ?? DELIVERY;\n    const raw = (time + revenue + risk) * delivery * mat.adj * integ * crm * painLift;\n    const budget = s.budget ? Number(s.budget) * 1000 : null;\n    const capped = budget && budget > 0 ? Math.min(raw, budget * 5.2) : raw;\n    const realistic = capped;\n    const budgetLimited = budget && budget > 0 && capped < raw * 0.98;\n    const upside = realistic * (this.props.upsideFactor ?? 1.5);\n\n    const scored = Object.keys(s.areaScores).filter(k => s.areaScores[k] != null).length;\n    const filled = [s.crm, s.integration, s.manual, s.pains.length ? 1 : null, s.hours, s.fnHead].filter(x => x !== null && x !== '' && x !== undefined).length + Math.round(scored / 2);\n    const spread = Math.max(0.10, 0.30 - filled * 0.026);\n    const investFactor = { 'None yet': 0.60, 'Exploring': 0.53, 'Piloting': 0.46, 'Scaling': 0.40 }[s.maturity];\n    const invest = budget && budget > 0 ? budget : Math.max(185000, realistic * investFactor * integ);\n    const payback = Math.min(24, Math.max(4, Math.round(12 * invest / realistic)));\n\n    return {\n      ind, realistic, upside, spread, payback, filled, invest, budgetLimited, revenue: size.rev,\n      weeks: mat.weeks,\n      confidence: Math.min(94, 45 + filled * 6),\n      cats: [\n        { label: 'Time recovered', v: time * DELIVERY * mat.adj },\n        { label: 'Revenue lift', v: revenue * DELIVERY * mat.adj },\n        { label: 'Cost avoidance', v: risk * 0.6 * DELIVERY },\n        { label: 'Risk reduction', v: risk * 0.4 * DELIVERY }\n      ]\n    };\n  }\n\n  range(mid, spread) { return this.money(mid * (1 - spread)) + ' – ' + this.money(mid * (1 + spread)); }\n\n  opts(list, key) {\n    return list.map(label => {\n      const on = this.state[key] === label;\n      return {\n        label,\n        pick: () => this.set(key, label),\n        style: 'cursor: pointer; border: 1px solid ' + (on ? '#D0441C' : '#D7DBDF') + '; background: ' + (on ? '#D0441C' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#3C434A') + '; font-size: 13.5px; font-weight: ' + (on ? '600' : '500') + '; padding: 9px 14px; border-radius: 2px; transition: all 0.16s ease;'\n      };\n    });\n  }\n\n  scores() {\n    const s = this.eff();\n    const mat = MAT[s.maturity];\n    const base = { 'None yet': 1.8, 'Exploring': 2.3, 'Piloting': 2.9, 'Scaling': 3.6 }[s.maturity];\n    const integTilt = s.integration === 'Siloed' ? -0.4 : s.integration === 'Unified' ? 0.4 : 0;\n    const crmTilt = s.crm === 'None' ? -0.35 : s.crm === 'Salesforce' ? 0.2 : 0;\n    const painTilt = {\n      data: s.pains.indexOf('Manual data entry') > -1 ? -0.4 : 0,\n      integration: s.integration === 'Siloed' ? -0.3 : 0,\n      revops: s.goal === 'Grow revenue' ? 0.15 : 0,\n      service: s.pains.indexOf('Slow response times') > -1 ? -0.45 : 0,\n      analytics: s.pains.indexOf('Poor visibility / reporting') > -1 ? -0.5 : 0,\n      ai: 0\n    };\n    return AREAS.map(a => {\n      const answered = s.areaScores[a.key];\n      const bias = { data: -0.3, integration: -0.15, revops: 0.35, service: 0.1, analytics: -0.45, ai: -0.55 }[a.key];\n      const indBias = ({\n        'Equipment dealer': { service: 0.3, analytics: -0.2, revops: -0.1 },\n        'Member association': { service: 0.15, revops: -0.35, data: -0.2 },\n        'Manufacturing': { integration: -0.25, revops: 0.1 },\n        'Distribution': { integration: -0.2, service: 0.2 },\n        'Professional services': { revops: 0.3, service: -0.15, data: 0.1 }\n      }[s.industry] || {})[a.key] || 0;\n      const inferred = Math.max(1, Math.min(5, base + bias + indBias + integTilt * 0.5 + crmTilt + (painTilt[a.key] || 0)));\n      const you = answered != null ? answered : inferred;\n      const peer = Math.max(1, Math.min(5, a.top - 1.25 + (a.key === 'revops' ? 0.1 : 0)));\n      return { area: a, you: Math.round(you * 10) / 10, peer: Math.round(peer * 10) / 10, top: a.top, answered: answered != null };\n    });\n  }\n\n  readout() {\n    const sc = this.scores();\n    const es = this.eff();\n    const answered = sc.filter(x => x.answered).length;\n    const avg = arr => (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1);\n    const gapOf = x => Math.max(0, x.top - x.you);\n    const byGap = sc.slice().sort((a, b) => gapOf(b) - gapOf(a));\n    const weakest = byGap[0];\n    const closest = byGap[byGap.length - 1];\n    const gap = gapOf(weakest).toFixed(1);\n    const closestGap = gapOf(closest).toFixed(1);\n    const allClear = gapOf(weakest) === 0;\n    const totalGap = sc.reduce((t, x) => t + Math.max(0, x.top - x.you), 0);\n    const emp = SIZE[es.size].emp;\n    const systems = Math.max(5, Math.round(6 + emp / 90));\n    const dupe = Math.round(Math.max(8, 38 - (sc.find(x => x.area.key === 'data').you - 1) * 8));\n\n    const dot = (pos, color, delay) => 'position: absolute; left: ' + pos + '%; top: 50%; transform: translate(-50%,-50%); width: 12px; height: 12px; border-radius: 50%; background: ' + color + '; transition: left 0.45s cubic-bezier(.2,.7,.3,1) ' + delay + 's;';\n    const pill = (pos, bg, delay) => 'position: absolute; left: ' + pos + '%; top: 50%; transform: translate(-50%,-50%); background: ' + bg + \"; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 5px 8px; border-radius: 12px; transition: left 0.45s cubic-bezier(.2,.7,.3,1) \" + delay + 's;';\n\n    return {\n      scoreSource: answered === 0 ? 'BENCHMARK DEFAULTS' : answered + ' OF 6 SCORED BY YOU',\n      readHeadline: allClear\n        ? 'At or above the top quartile in every area you scored — the assessment would go looking for where that lead is fragile.'\n        : 'Your widest gap is ' + weakest.area.label + ' — ' + gap + ' points behind the top quartile.',\n      youAvg: avg(sc.map(x => x.you)),\n      peerAvg: avg(sc.map(x => x.peer)),\n      topAvg: avg(sc.map(x => x.top)),\n      youPoly: this.poly(sc.map(x => x.you)),\n      peerPoly: this.poly(sc.map(x => x.peer)),\n      topPoly: this.poly(sc.map(x => x.top)),\n      findings: [\n        { value: '~' + systems, label: 'systems of record in an estate your size', note: 'and rarely two that define a customer the same way', tip: 'Estimated from headcount. In assessments at this size we typically find ' + systems + ' systems holding customer or asset data, each with its own definition of a record — the reason reports disagree.' },\n        { value: dupe + '%', label: 'estimated duplicate account records', note: 'the usual source of reporting disputes at this maturity', tip: 'Derived from your data-governance score. At ' + sc.find(x => x.area.key === 'data').you.toFixed(1) + '/5 we would expect roughly ' + dupe + '% duplication between CRM and ERP — the single largest driver of disputed numbers.' },\n        { value: totalGap.toFixed(1), label: 'total maturity points behind top quartile', note: 'across all six areas, self-reported', tip: 'The sum of every gap to the top quartile. Under 5 is a tuning exercise; over 10 usually means sequencing foundations before any AI use case.' },\n        allClear\n          ? { value: '0.0', label: 'points behind the top quartile anywhere', note: 'every area you scored is level with or ahead of the top quartile', tip: 'Unusual. At this profile the useful question is where the lead is fragile — single points of failure, key-person dependency, and whether the operating model survives growth.' }\n          : { value: gap, label: 'points behind in ' + weakest.area.shortLabel + ', your widest gap', note: closestGap === '0.0' ? 'level with the top quartile in ' + closest.area.shortLabel : 'closest to the top quartile: ' + closest.area.shortLabel + ', ' + closestGap + ' behind', tip: weakest.area.name + ' is where you are furthest from the operators who do this well, which usually makes it the first increment — most other gains depend on it.' }\n      ],\n      youPolyTip: 'Your profile across the six areas, ' + (answered === 0 ? 'inferred from your quick-start answers' : 'from the ' + answered + ' area' + (answered === 1 ? '' : 's') + ' you scored plus benchmarks for the rest') + '. The further from centre, the more mature.',\n      topPolyTip: 'Top quartile in your sector — the operators who already run this well. The space between the two shapes is the ground an assessment is scoped to close.',\n      rows: sc.map((x, i) => {\n        const yp = this.pct(x.you), pp = this.pct(x.peer), tp = this.pct(x.top);\n        const g = Math.max(0, x.top - x.you);\n        return {\n          name: x.area.name, sub: x.area.sub,\n          tip: x.area.name + ': you ' + x.you.toFixed(1) + ', peer median ' + x.peer.toFixed(1) + ', top quartile ' + x.top.toFixed(1) + '. ' +\n            (g === 0 ? 'You are level with or ahead of the top quartile here — worth protecting rather than investing further.'\n              : g > 1.8 ? 'The widest kind of gap: this is usually where a programme should start, because everything downstream depends on it.'\n              : g > 0.9 ? 'A closable gap — typically one or two focused increments.'\n              : 'Close to the top quartile. Incremental gain here, so not where we would start.') +\n            (x.answered ? '' : ' Inferred — score this area to replace the benchmark.'),\n          you: x.you.toFixed(1), top: x.top.toFixed(1),\n          gapStyle: 'position: absolute; left: ' + yp + '%; width: ' + Math.max(0, tp - yp) + '%; top: 50%; margin-top: -8px; height: 16px; background: #F7E6DE; border-radius: 2px; transition: all 0.45s cubic-bezier(.2,.7,.3,1);',\n          peerStyle: dot(pp, '#A9B0B7', 0.05 + i * 0.02),\n          youStyle: pill(yp, '#D0441C', i * 0.02),\n          topStyle: pill(tp, '#15181C', 0.1 + i * 0.02)\n        };\n      })\n    };\n  }\n\n  poly(vals) {\n    const ang = [-90, -30, 30, 90, 150, 210];\n    return vals.map((v, i) => {\n      const r = (v / 5) * 120;\n      const a = ang[i] * Math.PI / 180;\n      return (170 + r * Math.cos(a)).toFixed(1) + ',' + (160 + r * Math.sin(a)).toFixed(1);\n    }).join(' ');\n  }\n\n  pct(v) { return ((v - 1) / 4) * 100; }\n\n  setForm(k, v) { this.setState({ form: Object.assign({}, this.state.form, { [k]: v }), error: '' }); }\n\n  submit() {\n    const f = this.state.form;\n    if (!f.name.trim() || !f.company.trim() || !f.role.trim() || !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(f.email)) {\n      this.setState({ error: 'Add your name, work email, company and role to unlock the breakdown.' });\n      return;\n    }\n    this.setState({ gated: false, error: '' });\n  }\n\n  recommendations(m) {\n    const s = this.eff();\n    const out = [];\n    if (s.integration === 'Siloed' || s.crm === 'None') out.push('Unify the record first — one customer, asset and order truth before any model touches it.');\n    if (s.pains.indexOf('Manual data entry') > -1 || (s.manual === null ? MAT[s.maturity].manual : s.manual / 100) > 0.45) out.push('Automate the highest-volume manual path in ' + (s.industry === 'Equipment dealer' ? 'service intake' : 'your core workflow') + ' — that is where the hours are.');\n    if (s.pains.indexOf('Poor visibility / reporting') > -1) out.push('Stand up operational reporting leadership actually opens weekly, before adding predictive layers.');\n    if (s.pains.indexOf('Slow response times') > -1) out.push('Put a response-time commitment behind the front door and instrument it — it is the metric customers feel first.');\n    if (s.goal === 'Grow revenue') out.push('Instrument the pipeline end to end so forecast movement is evidence, not opinion.');\n    out.push('Sequence in eight-week increments with a measurable outcome each time — no eighteen-month programme.');\n    const tips = [\n      'Sequenced first because the later moves inherit its data. Typically eight to twelve weeks to a governed core.',\n      'Highest measurable return per week of effort — this is where the hours in your estimate come from.',\n      'Cheap relative to its effect on decision speed, and it makes every later claim auditable.',\n      'Lower value on its own, but it protects the gains above from eroding once the programme ends.'\n    ];\n    return out.slice(0, 4).map((text, i) => ({ n: '0' + (i + 1), text, tip: tips[i] }));\n  }\n\n  chipStyle(on, block) {\n    return 'cursor: pointer; text-align: left; border: 1px solid ' + (on ? '#D0441C' : '#D7DBDF') + '; background: ' + (on ? '#FDF1EC' : '#FFFFFF') + '; color: ' + (on ? '#B83C15' : '#3C434A') + '; font-size: 13px; font-weight: ' + (on ? '600' : '500') + '; padding: 9px 13px; border-radius: 2px; transition: all 0.16s ease;' + (block ? ' width: 100%;' : '');\n  }\n\n  singleOpts(list, key) {\n    return list.map(label => ({\n      label,\n      pick: () => this.set(key, this.state[key] === label ? null : label),\n      style: this.chipStyle(this.state[key] === label, false)\n    }));\n  }\n\n  renderVals() {\n    const m = this.model();\n    const s = this.state;\n    const es = this.eff();\n    const done = this.quickDone();\n    const pending = [\n      s.industry ? null : 'the kind of organisation',\n      s.size ? null : 'how many people',\n      s.goal ? null : 'your primary goal',\n      s.maturity ? null : 'where you are with AI'\n    ].filter(Boolean);\n    const defHead = Math.round(SIZE[es.size].emp * 0.35);\n    return {\n      showCalculator: s.stage >= 1,\n      showRefine: s.stage >= 2,\n      showMaturity: s.stage >= 3,\n      showReport: s.stage >= 4,\n      showMethod: s.stage >= 4 || s.methodOpen,\n      quickComplete: done,\n      quickPending: !done,\n      quickPendingNote: 'Answer ' + (pending.length === 1 ? pending[0] : pending.length + ' more — ' + pending.join(', ')) + ' to see your range.',\n      startFlow: () => this.advance(1, 'calculator'),\n      showMethodOnly: () => { if (!s.methodOpen) this.setState({ methodOpen: true }); this.glideTo('method', 140); },\n      goRefine: () => this.advance(2, 'refine'),\n      goMaturity: () => this.advance(3, 'maturity'),\n      goReport: () => this.advance(4, 'report'),\n      refineOpen: s.refineOpen,\n      toggleRefine: () => this.setState({ refineOpen: !s.refineOpen }),\n      refineBtnLabel: s.refineOpen ? 'HIDE DETAIL −' : 'GET A MORE PRECISE ESTIMATE +',\n      refineBtnStyle: 'cursor: pointer; border: 1px solid ' + (s.refineOpen ? '#D7DBDF' : '#15181C') + '; background: ' + (s.refineOpen ? '#FFFFFF' : '#15181C') + '; color: ' + (s.refineOpen ? '#3C434A' : '#FFFFFF') + \"; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; padding: 11px 16px; border-radius: 2px; transition: all 0.16s ease;\",\n      crmOpts: this.singleOpts(['Salesforce', 'Other CRM', 'None'], 'crm'),\n      integOpts: this.singleOpts(['Siloed', 'Partially connected', 'Unified'], 'integration'),\n      painOpts: PAINS.map(p => ({ label: p, pick: () => this.togglePain(p), style: this.chipStyle(s.pains.indexOf(p) > -1, true) })),\n      manualValue: s.manual === null ? Math.round(MAT[es.maturity].manual * 100) : s.manual,\n      manualLabel: (s.manual === null ? Math.round(MAT[es.maturity].manual * 100) + '% (benchmark)' : s.manual + '%'),\n      onManual: (e) => this.set('manual', Number(e.target.value)),\n      fnHeadValue: s.fnHead,\n      fnHeadPlaceholder: 'Benchmark: ' + defHead,\n      onFnHead: (e) => this.set('fnHead', e.target.value),\n      revenueValue: s.revenue || '',\n      revenuePlaceholder: 'Benchmark: ' + Math.round(SIZE[es.size].rev / 1e6),\n      onRevenue: (e) => this.set('revenue', e.target.value),\n      revenueTip: 'Revenue drives the growth half of the estimate. Given as a band from your size by default — your own figure replaces it and tightens the range.',\n      budgetValue: s.budget || '',\n      budgetPlaceholder: 'Benchmark: ' + Math.round(m.invest / 1000),\n      onBudget: (e) => this.set('budget', e.target.value),\n      budgetTip: 'What you could realistically commit in the next twelve months. We cap the return at roughly 5x the investment — a programme cannot return what it was never funded to reach.',\n      budgetNote: m.budgetLimited ? 'At this level of investment the return is scope-limited, not opportunity-limited — there is more available than this funds.' : 'Leave blank and we size the investment from the opportunity.',\n      hoursValue: s.hours,\n      hoursPlaceholder: 'Benchmark: 12',\n      onHours: (e) => this.set('hours', e.target.value),\n      industryOpts: this.opts(Object.keys(IND), 'industry'),\n      sizeOpts: this.opts(Object.keys(SIZE), 'size'),\n      goalOpts: this.opts(Object.keys(GOAL), 'goal'),\n      maturityOpts: this.opts(Object.keys(MAT), 'maturity'),\n      realisticRange: this.range(m.realistic, m.spread),\n      upsideRange: this.range(m.upside, m.spread * 0.9),\n      confidence: m.confidence + '%',\n      payback: m.payback,\n      firstValue: m.weeks,\n      opportunity: m.ind.opp,\n      comparison: m.ind.cmp,\n      gated: (this.props.gateEnabled ?? true) && (s.gated === null ? true : s.gated),\n      reportMinHeight: ((this.props.gateEnabled ?? true) && (s.gated === null ? true : s.gated)) ? '440px' : '0px',\n      rangeTip: 'Time recovered (' + this.money(m.cats[0].v) + ') plus revenue lift (' + this.money(m.cats[1].v) + ') plus cost and risk, adjusted for your maturity, integration and CRM, then multiplied by what our own engagements returned. Shown as a ±' + Math.round(m.spread * 100) + '% band.',\n      paybackTip: 'Against an assumed investment of ' + this.money(m.invest) + '. ' + (m.budgetLimited ? 'Set from the budget you entered.' : 'Sized from the opportunity — enter your own figure in Refine to replace it.'),\n      firstValueTip: 'First measurable outcome, not full rollout. Lower maturity takes longer to instrument; we sequence in eight-week increments so something lands before month three.',\n      confidenceTip: 'Rises with every field and area you answer: ' + m.filled + ' inputs supplied so far. Below 60% treat the number as a directional gut check.',\n      confidenceNote: 'Confidence is ' + Math.min(94, 45 + m.filled * 6) + '% — scoring the six areas takes it higher and narrows the range.',\n      catRows: m.cats.map(c => ({\n        label: c.label,\n        tip: {\n          'Time recovered': 'Hours given back across the affected function, valued at a loaded cost of $78k. The largest and most defensible line — it shows up in capacity before it shows up in the P&L.',\n          'Revenue lift': 'Growth from better pipeline visibility, faster quoting and fewer dropped follow-ups. Scaled by your revenue and weighted by your stated primary goal.',\n          'Cost avoidance': 'Licence consolidation, rework, and the manual reconciliation that disappears once systems agree.',\n          'Risk reduction': 'Fewer compliance and data-quality incidents, and less key-person dependency. Real but the slowest to show up.'\n        }[c.label],\n        amount: this.money(c.v),\n        barStyle: 'height: 100%; width: ' + Math.round(100 * c.v / Math.max.apply(null, m.cats.map(x => x.v))) + '%; background: ' + (c.label === 'Time recovered' ? '#D0441C' : c.label === 'Revenue lift' ? '#F0703F' : '#6B727A') + '; border-radius: 1px; transition: width 0.4s ease;'\n      })),\n      scoreOpen: s.scoreOpen,\n      toggleScore: () => this.setState({ scoreOpen: !s.scoreOpen }),\n      scoreBtnLabel: s.scoreOpen ? 'HIDE THE SIX QUESTIONS −' : 'SCORE THE SIX AREAS +',\n      scoreBtnStyle: 'cursor: pointer; border: 1px solid ' + (s.scoreOpen ? '#D7DBDF' : '#15181C') + '; background: ' + (s.scoreOpen ? '#FFFFFF' : '#15181C') + '; color: ' + (s.scoreOpen ? '#3C434A' : '#FFFFFF') + \"; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; padding: 11px 16px; border-radius: 2px; transition: all 0.16s ease;\",\n      questions: AREAS.map(a => ({\n        area: a.name.toUpperCase(),\n        badge: s.areaScores[a.key] != null ? 'SCORED ' + s.areaScores[a.key].toFixed(1) : 'BENCHMARK',\n        prompt: a.prompt,\n        options: a.opts.map(o => ({\n          label: o[0],\n          pick: () => this.setState({ areaScores: Object.assign({}, s.areaScores, { [a.key]: s.areaScores[a.key] === o[1] ? null : o[1] }) }),\n          style: this.chipStyle(s.areaScores[a.key] === o[1], true)\n        }))\n      })),\n      recs: this.recommendations(m),\n      ...this.readout(),\n      formName: s.form.name, formEmail: s.form.email, formCompany: s.form.company, formRole: s.form.role,\n      optIn: s.optIn !== false,\n      onName: (e) => this.setForm('name', e.target.value),\n      onEmail: (e) => this.setForm('email', e.target.value),\n      onCompany: (e) => this.setForm('company', e.target.value),\n      onRole: (e) => this.setForm('role', e.target.value),\n      onOptIn: (e) => this.setState({ optIn: e.target.checked }),\n      submit: () => this.submit(),\n      error: s.error\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
